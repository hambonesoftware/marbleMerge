name: Publish Marble Merge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify live physics and merging
        run: |
          npm ci
          npm run check
          npm test
      - name: Install browser smoke test tooling
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify mobile Broadcast HUD
        run: npx playwright test -c playwright.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marble-mobile-hud-qa
          path: test-results/
          if-no-files-found: ignore
      - name: Stage public game files
        run: |
          mkdir _site
          cp index.html styles.css .nojekyll _site/
          cp -R src v2 _site/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
